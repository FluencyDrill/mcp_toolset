# Local Postgres + pgvector for the durable knowledge store.
#
#   docker compose up -d
#   export MCP_TOOLSET_STORE=pgvector
#   export PG_CONN_STR=postgresql://mcp:mcp@localhost:5432/mcp_toolset
#   uv sync --extra postgres && make run
#
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp_toolset
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_toolset"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
