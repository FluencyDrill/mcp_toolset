[project]
name = "mcp-toolset"
version = "0.1.0"
description = "A Haystack + Hayhooks scaffold for building and serving pipelines as MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mcp_toolset" }]
dependencies = [
    "haystack-ai>=2.7",
    "hayhooks[mcp]>=0.8",
    "youtube-transcript-api>=0.6",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Durable Postgres/pgvector store backend. Install with: uv sync --extra postgres
postgres = ["pgvector-haystack>=3.0"]

# Optional LLM provider for the documented "answer over transcript" upgrade.
# Not required for the default, key-free pipelines.
openai = []  # OpenAIGenerator ships with haystack-ai; placeholder for clarity

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_toolset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "pipeline_wrappers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
